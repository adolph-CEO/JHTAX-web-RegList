<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>佳赫稅務 內部查閱頁</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Noto Sans TC', sans-serif; background: #F5F0E8; color: #3A2E12; }
.jh-wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-family: 'Noto Serif TC', serif; font-size: 19px; font-weight: 500; margin: 0 0 16px; color: #2C2412; }

/* 密碼登入畫面 */
.jh-gate { max-width: 360px; margin: 80px auto; padding: 28px 24px; background: #FFFFFF; border-radius: 14px; border: 1px solid rgba(200,135,42,0.25); text-align: center; }
.jh-gate p { font-size: 14px; color: #6B5A32; margin: 0 0 16px; }
.jh-gate input { width: 100%; font-size: 16px; padding: 12px 13px; border-radius: 9px; border: 1.5px solid #D9C9A3; background: #FBF8F2; margin-bottom: 12px; text-align: center; }
.jh-gate button { width: 100%; font-size: 15px; font-weight: 700; padding: 12px; border-radius: 9px; border: none; background: #B8860B; color: #FFFFFF; cursor: pointer; }
.jh-gate__error { font-size: 13px; color: #B23A2E; margin-top: 10px; display: none; }
.jh-gate__error.is-visible { display: block; }

.jh-search { display: flex; gap: 8px; margin-bottom: 16px; }
.jh-search input { flex: 1; font-size: 16px; padding: 10px 12px; border-radius: 8px; border: 1px solid #D9C9A3; background: #FBF8F2; }
.jh-filter { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.jh-filter button { font-size: 13px; padding: 6px 12px; border-radius: 20px; border: 1px solid #C8872A; background: #FFFFFF; color: #6B5A32; cursor: pointer; }
.jh-filter button.is-active { background: #C8872A; color: #FFFFFF; }

/* 條列式列表:固定高度,不會因為展開而跳動 */
.jh-row { display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid rgba(200,135,42,0.25); cursor: pointer; }
.jh-row.is-dimmed { opacity: .55; }
.jh-row.is-active { border-color: #C8872A; background: #FBF0DC; box-shadow: 0 0 0 2px rgba(200,135,42,0.25); }
.jh-row.is-highlighted { border-color: #C8872A; box-shadow: 0 0 0 3px rgba(200,135,42,0.18); }
.jh-row__status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.jh-row__name { font-size: 15px; font-weight: 700; color: #2C2412; flex-shrink: 0; }
.jh-row__phone { font-size: 13px; color: #6B5A32; font-family: 'Space Mono', 'Noto Sans TC', monospace; flex-shrink: 0; }
.jh-row__scene { font-size: 11px; background: #FBF8F2; color: #B8860B; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; white-space: nowrap; }
.jh-row__status-label { font-size: 11px; color: #6B5A32; flex-shrink: 0; white-space: nowrap; }
.jh-row__time { font-size: 12px; color: #8A7A50; margin-left: auto; flex-shrink: 0; }

/* 彈跳視窗 */
.jh-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(44,36,18,0.45); align-items: center; justify-content: center; padding: 20px; z-index: 100; }
.jh-modal-overlay.is-visible { display: flex; }
.jh-modal { background: #FFFFFF; border-radius: 14px; padding: 24px 22px; max-width: 420px; width: 100%; max-height: 82vh; overflow-y: auto; }
.jh-modal__top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.jh-modal__name { font-family: 'Noto Serif TC', serif; font-size: 19px; font-weight: 600; color: #2C2412; }
.jh-modal__close { background: none; border: none; font-size: 20px; color: #8A7A50; cursor: pointer; line-height: 1; padding: 2px; }
.jh-modal__time { font-size: 12px; color: #8A7A50; margin-bottom: 12px; }
.jh-modal__scene { display: inline-block; font-size: 12px; background: #FBF8F2; color: #B8860B; padding: 2px 8px; border-radius: 12px; margin-bottom: 12px; }
.jh-modal__phone { font-size: 15px; color: #4A3B14; font-weight: 700; margin-bottom: 14px; }
.jh-modal__detail { font-size: 14px; color: #5A4A26; line-height: 1.9; white-space: pre-wrap; margin-bottom: 18px; padding-top: 14px; border-top: 1px solid rgba(200,135,42,0.15); }
.jh-modal__status-label { font-size: 12px; color: #8A7A50; margin-bottom: 8px; }
.jh-modal__status-current { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.jh-modal__status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.jh-modal__status-btn { font-size: 13px; font-weight: 500; padding: 10px 8px; border-radius: 9px; border: 1.5px solid #D9C9A3; background: #FBF8F2; color: #4A3B14; cursor: pointer; }
.jh-modal__status-btn[disabled] { border-color: #C8872A; background: #FBF0DC; color: #8B6508; font-weight: 700; cursor: default; }

.jh-empty { text-align: center; color: #8A7A50; font-size: 14px; padding: 40px 0; }
.jh-config { font-size: 13px; color: #8A7A50; background: #FBF8F2; border: 1px dashed #C8872A; border-radius: 8px; padding: 12px; margin-bottom: 16px; line-height: 1.7; }
.jh-hidden { display: none !important; }
</style>
</head>
<body>

<div id="gateScreen" class="jh-gate">
  <p>請輸入密碼進入查閱頁</p>
  <input type="password" id="gateInput" placeholder="密碼" autocomplete="off">
  <button type="button" id="gateSubmit">進入</button>
  <p class="jh-gate__error" id="gateError">密碼錯誤,請再試一次。</p>
</div>

<div id="mainScreen" class="jh-wrap jh-hidden">
  <h1>網路登記 查閱清單 <button type="button" id="refreshBtn" style="font-size:12px; padding:4px 10px; border-radius:14px; border:1px solid #C8872A; background:#FFFFFF; color:#B8860B; cursor:pointer; vertical-align:middle;">重新整理</button></h1>

  <div id="configNotice" class="jh-config" style="display:none;">
    尚未設定資料來源網址。請把 Apps Script 部署後的網址填進本檔案裡的 <code>ENDPOINT_URL</code>。
  </div>

  <div class="jh-search">
    <input type="text" id="searchBox" placeholder="輸入手機號碼或稱呼搜尋">
  </div>
  <div class="jh-filter" id="filterBar">
    <button type="button" class="is-active" data-filter="all">全部</button>
    <button type="button" data-filter="未處理">未處理</button>
    <button type="button" data-filter="已聯絡">已聯絡</button>
    <button type="button" data-filter="聯絡不上(3次)">聯絡不上(3次)</button>
    <button type="button" data-filter="委託中">委託中</button>
    <button type="button" data-filter="不委託">不委託</button>
  </div>

  <div id="list"></div>
  <div id="emptyState" class="jh-empty" style="display:none;">目前沒有符合的資料</div>
</div>

<div class="jh-modal-overlay" id="modalOverlay">
  <div class="jh-modal">
    <div class="jh-modal__top">
      <span class="jh-modal__name" id="modalName"></span>
      <button type="button" class="jh-modal__close" id="modalClose">✕</button>
    </div>
    <div class="jh-modal__time" id="modalTime"></div>
    <span class="jh-modal__scene" id="modalScene"></span>
    <div class="jh-modal__phone" id="modalPhone"></div>
    <div class="jh-modal__detail" id="modalDetail"></div>
    <div class="jh-modal__status-label">目前狀態</div>
    <div class="jh-modal__status-current" id="modalStatusCurrent"></div>
    <div class="jh-modal__status-grid" id="modalStatusGrid"></div>
  </div>
</div>

<script>
// 待辦:部署時把這裡換成跟 jhtax-line-hub.html 相同的 Apps Script Web App 網址
var ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbzLZSFJboTo1rKHiYKrqpHRIfbkLOPLSnJcaLvlFv9IaRPZZTfDsrm6uh5IMioxx8TJNg/exec';

var STATUSES = ['未處理', '已聯絡', '聯絡不上(3次)', '不委託', '委託中'];
var STATUS_COLOR = {
  '未處理': '#B8860B',
  '已聯絡': '#8B6508',
  '聯絡不上(3次)': '#B23A2E',
  '不委託': '#C9C0A8',
  '委託中': '#4B7455'
};

var allRows = [];
var currentFilter = 'all';
var highlightRow = Number(new URLSearchParams(location.search).get('row')) || null;
var hasScrolled = false;
var accessKey = '';
var activeRowNumber = null;

// --- 密碼登入 ---
document.getElementById('gateSubmit').addEventListener('click', tryEnter);
document.getElementById('gateInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') tryEnter();
});

function tryEnter() {
  var input = document.getElementById('gateInput');
  accessKey = input.value.trim();
  if (!accessKey) return;
  var btn = document.getElementById('gateSubmit');
  btn.disabled = true;
  btn.textContent = '登入中…';
  document.getElementById('gateError').classList.remove('is-visible');
  loadData();
}

function showGateError() {
  var btn = document.getElementById('gateSubmit');
  btn.disabled = false;
  btn.textContent = '進入';
  document.getElementById('gateError').classList.add('is-visible');
}

function unlockScreen() {
  document.getElementById('gateScreen').classList.add('jh-hidden');
  document.getElementById('mainScreen').classList.remove('jh-hidden');
}

// --- 資料讀取與呈現 ---
function render() {
  var q = document.getElementById('searchBox').value.trim();
  var listEl = document.getElementById('list');
  var filtered = allRows.filter(function(row){
    if (currentFilter !== 'all' && row['狀態'] !== currentFilter) return false;
    if (!q) return true;
    return (row['手機號碼'] || '').indexOf(q) !== -1 || (row['稱呼'] || '').indexOf(q) !== -1;
  });

  document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';
  listEl.innerHTML = filtered.map(function(row){
    var status = row['狀態'] || '未處理';
    var isTarget = highlightRow && Number(row['_row']) === highlightRow;
    var isActive = activeRowNumber === Number(row['_row']);
    var dotColor = STATUS_COLOR[status] || '#B8860B';
    return '<div class="jh-row' + (status === '不委託' ? ' is-dimmed' : '') + (isTarget ? ' is-highlighted' : '') + (isActive ? ' is-active' : '') + '" data-row="' + row['_row'] + '">' +
      '<span class="jh-row__status-dot" style="background:' + dotColor + ';"></span>' +
      '<span class="jh-row__name">' + escapeHtml(row['稱呼']) + '</span>' +
      '<span class="jh-row__phone">' + escapeHtml(row['手機號碼']) + '</span>' +
      '<span class="jh-row__scene">' + escapeHtml(row['情境']) + '</span>' +
      '<span class="jh-row__status-label">' + escapeHtml(status) + '</span>' +
      '<span class="jh-row__time">' + escapeHtml(formatTime(row['送出時間'])) + '</span>' +
      '</div>';
  }).join('');

  listEl.querySelectorAll('.jh-row').forEach(function(rowEl){
    rowEl.addEventListener('click', function(){
      openModal(Number(rowEl.dataset.row));
    });
  });

  if (highlightRow && !hasScrolled) {
    var target = listEl.querySelector('.is-highlighted');
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      hasScrolled = true;
      openModal(highlightRow);
    }
  }
}

function findRow(rowNumber) {
  for (var i = 0; i < allRows.length; i++) {
    if (Number(allRows[i]['_row']) === rowNumber) return allRows[i];
  }
  return null;
}

// --- 彈跳視窗 ---
function openModal(rowNumber) {
  var row = findRow(rowNumber);
  if (!row) return;
  activeRowNumber = rowNumber;
  render();

  var extra = {};
  try { extra = JSON.parse(row['其他欄位JSON'] || '{}'); } catch(e){}
  var detailLines = Object.keys(extra).filter(function(k){ return k !== 'scene' && extra[k]; })
    .map(function(k){ return k + ':' + extra[k]; }).join('\n');
  var currentStatus = row['狀態'] || '未處理';

  document.getElementById('modalName').textContent = row['稱呼'] || '';
  document.getElementById('modalTime').textContent = formatTime(row['送出時間']);
  document.getElementById('modalScene').textContent = row['情境'] || '';
  document.getElementById('modalPhone').textContent = row['手機號碼'] || '';
  document.getElementById('modalDetail').textContent = detailLines;
  document.getElementById('modalDetail').style.display = detailLines ? 'block' : 'none';

  var statusCurrentEl = document.getElementById('modalStatusCurrent');
  statusCurrentEl.textContent = currentStatus;
  statusCurrentEl.style.color = STATUS_COLOR[currentStatus] || '#8B6508';

  var gridEl = document.getElementById('modalStatusGrid');
  gridEl.innerHTML = STATUSES.map(function(s){
    var isCurrent = s === currentStatus;
    return '<button type="button" class="jh-modal__status-btn" data-status="' + escapeHtml(s) + '" ' + (isCurrent ? 'disabled' : '') + '>' + escapeHtml(s) + '</button>';
  }).join('');
  gridEl.querySelectorAll('.jh-modal__status-btn:not([disabled])').forEach(function(btn){
    btn.addEventListener('click', function(){
      setStatus(rowNumber, btn.dataset.status, btn);
    });
  });

  document.getElementById('modalOverlay').classList.add('is-visible');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('is-visible');
  activeRowNumber = null;
  render();
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', function(e){
  if (e.target.id === 'modalOverlay') closeModal();
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeModal();
});

function escapeHtml(s) {
  return (s === undefined || s === null ? '' : String(s))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatTime(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function setStatus(rowNumber, status, btn) {
  var grid = document.getElementById('modalStatusGrid');
  grid.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
  if (btn) btn.textContent = '更新中…';
  fetch(ENDPOINT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'set_status', row: Number(rowNumber), status: status, key: accessKey })
  }).then(function(){
    closeModal();
    loadData();
  }).catch(function(){
    grid.querySelectorAll('button').forEach(function(b){ b.disabled = false; });
    if (btn) btn.textContent = '更新失敗,再試一次';
  });
}

function loadData() {
  if (ENDPOINT_URL.indexOf('PASTE_') === 0) {
    unlockScreen();
    document.getElementById('configNotice').style.display = 'block';
    return;
  }
  fetch(ENDPOINT_URL + '?key=' + encodeURIComponent(accessKey)).then(function(r){ return r.json(); }).then(function(result){
    if (result && result.error === 'unauthorized') {
      showGateError();
      return;
    }
    unlockScreen();
    allRows = result;
    render();
  }).catch(function(){
    showGateError();
  });
}

document.getElementById('searchBox') && document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('refreshBtn') && document.getElementById('refreshBtn').addEventListener('click', function(){
  if (accessKey) loadData();
});
document.querySelectorAll('#filterBar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('#filterBar button').forEach(function(b){ b.classList.remove('is-active'); });
    btn.classList.add('is-active');
    currentFilter = btn.dataset.filter;
    render();
  });
});
</script>
</body>
</html>
