<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>佳赫稅務 內部查閱頁</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap');
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Noto Sans TC', sans-serif; background: #F5F0E8; color: #3A2E12; }
.jh-wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-family: 'Noto Serif TC', serif; font-size: 19px; font-weight: 500; margin: 0 0 16px; color: #2C2412; }

/* 密碼登入畫面 */
.jh-gate { max-width: 360px; margin: 80px auto; padding: 28px 24px; background: #FFFFFF; border-radius: 14px; border: 1px solid rgba(200,135,42,0.25); text-align: center; }
.jh-gate p { font-size: 14px; color: #6B5A32; margin: 0 0 16px; }
.jh-gate input { width: 100%; font-size: 16px; padding: 12px 13px; border-radius: 9px; border: 1.5px solid #D9C9A3; background: #FBF8F2; margin-bottom: 12px; text-align: center; }
.jh-gate button { width: 100%; font-size: 15px; font-weight: 700; padding: 12px; border-radius: 9px; border: none; background: #B8860B; color: #FFFFFF; cursor: pointer; }
.jh-gate__error { font-size: 13px; color: #B23A2E; margin-top: 10px; display: none; }
.jh-gate__error.is-visible { display: block; }

.jh-search { display: flex; gap: 8px; margin-bottom: 16px; }
.jh-search input { flex: 1; font-size: 16px; padding: 10px 12px; border-radius: 8px; border: 1px solid #D9C9A3; background: #FBF8F2; }
.jh-filter { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.jh-filter button { font-size: 13px; padding: 6px 12px; border-radius: 20px; border: 1px solid #C8872A; background: #FFFFFF; color: #6B5A32; }
.jh-filter button.is-active { background: #C8872A; color: #FFFFFF; }

.jh-card { background: #FFFFFF; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(200,135,42,0.25); }
.jh-card.is-processed { opacity: .55; }
.jh-card.is-highlighted { border: 2px solid #C8872A; box-shadow: 0 0 0 3px rgba(200,135,42,0.18); }
.jh-card__top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.jh-card__name { font-size: 16px; font-weight: 700; color: #2C2412; }
.jh-card__time { font-size: 12px; color: #8A7A50; }
.jh-card__scene { display: inline-block; font-size: 12px; background: #FBF8F2; color: #B8860B; padding: 2px 8px; border-radius: 12px; margin-bottom: 8px; }
.jh-card__phone { font-size: 14px; color: #4A3B14; margin-bottom: 8px; }
.jh-card__detail { font-size: 13px; color: #5A4A26; line-height: 1.8; white-space: pre-wrap; margin-bottom: 12px; }
.jh-card__btn { font-size: 13px; padding: 8px 14px; border-radius: 8px; border: none; background: #B8860B; color: #FFFFFF; cursor: pointer; }
.jh-card__btn[disabled] { background: #C9C0A8; cursor: default; }

.jh-empty { text-align: center; color: #8A7A50; font-size: 14px; padding: 40px 0; }
.jh-config { font-size: 13px; color: #8A7A50; background: #FBF8F2; border: 1px dashed #C8872A; border-radius: 8px; padding: 12px; margin-bottom: 16px; line-height: 1.7; }
.jh-hidden { display: none !important; }
</style>
</head>
<body>

<div id="gateScreen" class="jh-gate">
  <p>請輸入密碼進入查閱頁</p>
  <input type="password" id="gateInput" placeholder="密碼" autocomplete="off">
  <button type="button" id="gateSubmit">進入</button>
  <p class="jh-gate__error" id="gateError">密碼錯誤,請再試一次。</p>
</div>

<div id="mainScreen" class="jh-wrap jh-hidden">
  <h1>網路登記 查閱清單 <button type="button" id="refreshBtn" style="font-size:12px; padding:4px 10px; border-radius:14px; border:1px solid #C8872A; background:#FFFFFF; color:#B8860B; cursor:pointer; vertical-align:middle;">重新整理</button></h1>

  <div id="configNotice" class="jh-config" style="display:none;">
    尚未設定資料來源網址。請把 Apps Script 部署後的網址填進本檔案裡的 <code>ENDPOINT_URL</code>。
  </div>

  <div class="jh-search">
    <input type="text" id="searchBox" placeholder="輸入手機號碼或稱呼搜尋">
  </div>
  <div class="jh-filter">
    <button type="button" class="is-active" data-filter="all">全部</button>
    <button type="button" data-filter="未處理">未處理</button>
    <button type="button" data-filter="已處理">已處理</button>
  </div>

  <div id="list"></div>
  <div id="emptyState" class="jh-empty" style="display:none;">目前沒有符合的資料</div>
</div>

<script>
// 待辦:部署時把這裡換成跟 jhtax-line-hub.html 相同的 Apps Script Web App 網址
var ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbzLZSFJboTo1rKHiYKrqpHRIfbkLOPLSnJcaLvlFv9IaRPZZTfDsrm6uh5IMioxx8TJNg/exec';

var allRows = [];
var currentFilter = 'all';
var highlightRow = Number(new URLSearchParams(location.search).get('row')) || null;
var hasScrolled = false;
var accessKey = '';

// --- 密碼登入 ---
document.getElementById('gateSubmit').addEventListener('click', tryEnter);
document.getElementById('gateInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') tryEnter();
});

function tryEnter() {
  var input = document.getElementById('gateInput');
  accessKey = input.value.trim();
  if (!accessKey) return;
  var btn = document.getElementById('gateSubmit');
  btn.disabled = true;
  btn.textContent = '登入中…';
  document.getElementById('gateError').classList.remove('is-visible');
  loadData();
}

function showGateError() {
  var btn = document.getElementById('gateSubmit');
  btn.disabled = false;
  btn.textContent = '進入';
  document.getElementById('gateError').classList.add('is-visible');
}

function unlockScreen() {
  document.getElementById('gateScreen').classList.add('jh-hidden');
  document.getElementById('mainScreen').classList.remove('jh-hidden');
}

// --- 資料讀取與呈現 ---
function render() {
  var q = document.getElementById('searchBox').value.trim();
  var listEl = document.getElementById('list');
  var filtered = allRows.filter(function(row){
    if (currentFilter !== 'all' && row['狀態'] !== currentFilter) return false;
    if (!q) return true;
    return (row['手機號碼'] || '').indexOf(q) !== -1 || (row['稱呼'] || '').indexOf(q) !== -1;
  });

  document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';
  listEl.innerHTML = filtered.map(function(row){
    var extra = {};
    try { extra = JSON.parse(row['其他欄位JSON'] || '{}'); } catch(e){}
    var detailLines = Object.keys(extra).filter(function(k){ return k !== 'scene' && extra[k]; })
      .map(function(k){ return k + ':' + extra[k]; }).join('\n');
    var processed = row['狀態'] === '已處理';
    var isTarget = highlightRow && Number(row['_row']) === highlightRow;
    return '<div class="jh-card' + (processed ? ' is-processed' : '') + (isTarget ? ' is-highlighted' : '') + '" ' + (isTarget ? 'data-highlighted="1"' : '') + '>' +
      '<div class="jh-card__top"><span class="jh-card__name">' + escapeHtml(row['稱呼']) + '</span>' +
      '<span class="jh-card__time">' + escapeHtml(formatTime(row['送出時間'])) + '</span></div>' +
      '<span class="jh-card__scene">' + escapeHtml(row['情境']) + '</span>' +
      '<div class="jh-card__phone">手機末三碼核對:' + escapeHtml((row['手機號碼']||'').toString().slice(-3)) + '(完整:' + escapeHtml(row['手機號碼']) + ')</div>' +
      (detailLines ? '<div class="jh-card__detail">' + escapeHtml(detailLines) + '</div>' : '') +
      '<button class="jh-card__btn" data-row="' + row['_row'] + '" ' + (processed ? 'disabled' : '') + '>' +
      (processed ? '已處理' : '標記已處理') + '</button></div>';
  }).join('');

  listEl.querySelectorAll('.jh-card__btn:not([disabled])').forEach(function(btn){
    btn.addEventListener('click', function(){
      markProcessed(btn.dataset.row, btn);
    });
  });

  if (highlightRow && !hasScrolled) {
    var target = listEl.querySelector('[data-highlighted="1"]');
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      hasScrolled = true;
    }
  }
}

function escapeHtml(s) {
  return (s === undefined || s === null ? '' : String(s))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatTime(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function markProcessed(rowNumber, btn) {
  btn.disabled = true;
  btn.textContent = '處理中…';
  fetch(ENDPOINT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'mark_processed', row: Number(rowNumber), key: accessKey })
  }).then(function(){
    loadData();
  }).catch(function(){
    btn.disabled = false;
    btn.textContent = '標記失敗,再試一次';
  });
}

function loadData() {
  if (ENDPOINT_URL.indexOf('PASTE_') === 0) {
    unlockScreen();
    document.getElementById('configNotice').style.display = 'block';
    return;
  }
  fetch(ENDPOINT_URL + '?key=' + encodeURIComponent(accessKey)).then(function(r){ return r.json(); }).then(function(result){
    if (result && result.error === 'unauthorized') {
      showGateError();
      return;
    }
    unlockScreen();
    allRows = result;
    render();
  }).catch(function(){
    showGateError();
  });
}

document.getElementById('searchBox') && document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('refreshBtn') && document.getElementById('refreshBtn').addEventListener('click', function(){
  if (accessKey) loadData();
});
document.querySelectorAll('.jh-filter button').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.jh-filter button').forEach(function(b){ b.classList.remove('is-active'); });
    btn.classList.add('is-active');
    currentFilter = btn.dataset.filter;
    render();
  });
});
</script>
</body>
</html>
